# Render Blueprint for the KayGPT backend (FastAPI) + PostgreSQL.
# The Next.js frontend deploys to Vercel (see docs/deployment.md).
databases:
  - name: kaygpt-db
    databaseName: kaygpt
    user: kaygpt
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: kaygpt-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter # persistent disks require a paid instance
    healthCheckPath: /api/v1/health
    # Migrations run before the new version takes traffic.
    preDeployCommand: alembic upgrade head
    # Chroma index + uploads. A disk pins the service to ONE instance and disables
    # zero-downtime deploys; for horizontal scaling use STORAGE_BACKEND=s3 + CHROMA_MODE=http.
    disk:
      name: kaygpt-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: APP_ENV
        value: production
      - key: RUN_MIGRATIONS
        value: "false" # handled by preDeployCommand
      - key: DATABASE_URL
        fromDatabase:
          name: kaygpt-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: FRONTEND_URL
        sync: false # e.g. https://kaygpt.vercel.app
      - key: BACKEND_URL
        sync: false # e.g. https://kaygpt-api.onrender.com
      - key: CHROMA_PERSIST_DIRECTORY
        value: /data/chroma
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: STORAGE_BACKEND
        value: local
      - key: LANGSMITH_TRACING
        value: "false"
